name: Tests

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: testsecretkey123changeme
      AI_PROVIDER: mock
      PYTEST_CURRENT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies (no psycopg2/redis/celery needed for SQLite tests)
        run: pip install -r backend/requirements-test.txt
      - name: Run tests
        run: cd backend && python -m pytest ../tests/ -v --tb=long -p no:warnings 2>&1 | tail -60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm install && npm run build
