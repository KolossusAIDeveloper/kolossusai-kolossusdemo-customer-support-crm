name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: testsecretkey123changeme
      AI_PROVIDER: mock
      PYTEST_CURRENT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r backend/requirements-test.txt
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest ../tests/ -x --tb=short -q 2>&1 | tee /tmp/pytest_out.txt
          echo "EXIT:$?" >> /tmp/pytest_out.txt
      - name: Show test results (always)
        if: always()
        run: |
          echo "=== TEST RESULTS ==="
          cat /tmp/pytest_out.txt 2>/dev/null || echo "No test output"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm install --silent && npm run build
